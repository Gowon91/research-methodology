<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연구방법론 강의 교재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2635;--paper:#F5F4EF;--grid:#D8DFE6;--graph:#3D6B8E;--hl:#FFD447;--sub:#5C6774;--card:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;line-height:1.8;font-size:16px;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:960px;margin:0 auto;padding:0 24px;width:100%}
header{padding:84px 0 40px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.22em;color:var(--graph);margin-bottom:14px}
h1{font-family:'Gowun Batang',serif;font-size:clamp(30px,5vw,50px);line-height:1.35}
.mark{background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 94%,transparent 94%);padding:0 2px}
.sub{color:var(--sub);margin-top:14px;max-width:560px}
main{flex:1;padding:16px 0 64px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--ink);box-shadow:6px 6px 0 rgba(27,38,53,.11);padding:28px 26px;color:inherit;text-decoration:none}
.card:hover,.card:focus-visible{background:#FFFBE6;box-shadow:8px 8px 0 rgba(27,38,53,.18)}
.card:focus-visible{outline:3px solid var(--graph);outline-offset:3px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:var(--graph)}
.card h2{font-family:'Gowun Batang',serif;font-size:26px;line-height:1.4;margin:8px 0 10px}
.card p{color:var(--sub);flex:1}
.meta{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:16px;color:var(--ink)}
.go{margin-top:18px;font-weight:700}
footer{border-top:2px solid var(--ink);background:rgba(245,244,239,.9);padding:20px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sub)}
@media(max-width:700px){.cards{grid-template-columns:1fr}header{padding:56px 0 28px}}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s,background .15s}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="eyebrow">RESEARCH METHODOLOGY</div>
<h1>연구방법론<br><span class="mark">강의 교재</span></h1>
<p class="sub">학기 전체 강의와 체계적 문헌고찰 특강을 한곳에서 엽니다.</p>
</div></header>
<main><div class="wrap"><div class="cards">
<a class="card" href="methods.html">
<span class="tag">COURSE · 15 WEEKS</span>
<h2>연구방법론: 데이터를 읽는 눈</h2>
<p>데이터를 읽고 해석하는 연구방법론 전체 강의 교재입니다. 주차별로 구성되어 있습니다.</p>
<span class="meta">week 01 – 15</span>
<span class="go">교재 열기 →</span>
</a>
<a class="card" href="slr/index.html">
<span class="tag">SPECIAL · SLR</span>
<h2>체계적 문헌고찰</h2>
<p>연구질문부터 검색, 서지 관리, 선별, 종합과 보고까지. 검색 화면 캡처와 직접 해 보는 도구가 들어 있습니다.</p>
<span class="meta">소개 + 6개 장</span>
<span class="go">교재 열기 →</span>
</a>
</div></div></main>
<footer><div class="wrap">연구방법론 강의 교재</div></footer>
<script src="review-tool.js" defer></script>
</body>
</html>
